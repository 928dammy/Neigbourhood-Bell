<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-to-Door - Vendor Portal</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 15px;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
            text-align: left;
        }
        label { font-weight: bold; font-size: 13px; display: block; margin-top: 10px; color: #333; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button.stop { background: #dc3545; }
        .status-box {
            margin-top: 15px;
            padding: 10px;
            background: #e9f7ef;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
    </style>

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h2>Vendor Broadcast Portal 🛵</h2>
    <p style="font-size: 13px; color: #666;">Set your route, departure time, and go live!</p>

    <div class="card">
        <label for="vendorId">Vendor Name / ID:</label>
        <input type="text" id="vendorId" placeholder="e.g., Auntie Muni">

        <label for="productCode">Select Product:</label>
        <select id="productCode">
            <option value="bread">🍞 Fresh Bread</option>
            <option value="beans">🫘 Hot Beans & Plantain</option>
            <option value="chips">🍟 Plantain Chips</option>
            <option value="water">🧊 Ice Water</option>
        </select>

        <label for="routeLane">Desired Route / Street Lane:</label>
        <select id="routeLane">
            <option value="Ridge Road Lane">Ridge Road Lane</option>
            <option value="Airport Residential Way">Airport Residential Way</option>
            <option value="Cantonments Boulevard">Cantonments Boulevard</option>
            <option value="Spintex Highway Track">Spintex Highway Track</option>
        </select>

        <label for="departureTime">Scheduled Departure Time:</label>
        <input type="time" id="departureTime" value="14:00">

        <label for="vendorNote">Quick Audio Note / Status:</label>
        <textarea id="vendorNote" rows="2" placeholder="Hot fresh beans ready at the gate!"></textarea>

        <button id="broadcastBtn" onclick="toggleBroadcast()">Start Walking / Go Live</button>

        <div id="statusBox" class="status-box">
            🟢 <b>Broadcasting Live!</b><br>
            Your GPS & route are streaming to the customer radar.
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLive = false;
        let watchId = null;
        let pingInterval = null;
        let currentLat = 5.6037;
        let currentLon = -0.1870;

        async function toggleBroadcast() {
            const vendorId = document.getElementById("vendorId").value.trim();
            const productCode = document.getElementById("productCode").value;
            const routeLane = document.getElementById("routeLane").value;
            const departureTime = document.getElementById("departureTime").value;
            const vendorNote = document.getElementById("vendorNote").value;
            const btn = document.getElementById("broadcastBtn");
            const statusBox = document.getElementById("statusBox");

            if (!vendorId) {
                alert("Please enter your Vendor Name or ID.");
                return;
            }

            if (!isLive) {
                // Start broadcasting
                isLive = true;
                btn.innerText = "Stop Broadcasting";
                btn.className = "stop";
                statusBox.style.display = "block";

                // Get initial GPS
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(position => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                    }, err => console.log("GPS watch error:", err), { enableHighAccuracy: true });
                }

                // Send initial sync and repeat every 5 seconds
                sendDataToSupabase(vendorId, productCode, routeLane, departureTime, vendorNote);
                pingInterval = setInterval(() => {
                    sendDataToSupabase(vendorId, productCode, routeLane, departureTime, vendorNote);
                }, 5000);

            } else {
                // Stop broadcasting (Delete from active_hawkers)
                isLive = false;
                btn.innerText = "Start Walking / Go Live";
                btn.className = "";
                statusBox.style.display = "none";

                if (watchId) navigator.geolocation.clearWatch(watchId);
                clearInterval(pingInterval);

                await supabaseClient.from('active_hawkers').delete().eq('id', vendorId);
                alert("You are now offline.");
            }
        }

        async function sendDataToSupabase(id, product_code, route_lane, departure_time, vendor_note) {
            const { error } = await supabaseClient
                .from('active_hawkers')
                .upsert([{
                    id: id,
                    product_code: product_code,
                    route_lane: route_lane,
                    departure_time: departure_time + ':00',
                    vendor_note: vendor_note,
                    lat: currentLat,
                    lon: currentLon,
                    updated_at: new Date()
                }]);

            if (error) {
                console.error("Supabase sync error:", error);
            }
        }
    </script>
</body>
</html>
