<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Mode - Store-to-Door</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 30px 20px;
            margin: 0;
        }
        h2 { color: #333; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .setup-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto 20px auto;
            text-align: left;
        }
        label { font-weight: bold; font-size: 14px; color: #444; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        #toggleBtn {
            font-size: 26px;
            padding: 25px 40px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            transition: 0.2s;
            width: 100%;
            max-width: 400px;
        }
        #toggleBtn.active {
            background-color: #dc3545;
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        #status {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>🛒 Vendor Portal</h2>
    <div class="subtitle">Keep it on while walking your route</div>
    
    <div class="setup-box">
        <label for="hawkerName">Your Name / Business:</label>
        <input type="text" id="hawkerName" value="Auntie Muni">

        <label for="productType">What are you selling?</label>
        <select id="productType">
            <option value="bread">Fresh Bread (Bicycle Bell)</option>
            <option value="chips">Plantain Chips (Whistle)</option>
            <option value="water">Sachet / Ice Water (Cooler Clink)</option>
        </select>

        <label for="routeLane">Your Walking Lane / Area:</label>
        <input type="text" id="routeLane" value="Dansoman High Street">

        <label for="vendorNote">Quick Status Note (Optional):</label>
        <input type="text" id="vendorNote" value="Hot butter bread available!">
    </div>

    <!-- Massive One-Tap Button -->
    <button id="toggleBtn" onclick="toggleWalking()">Start Walking</button>

    <div id="status">Status: Offline (Tap above when ready)</div>

    <script>
        let watchId = null;
        const btn = document.getElementById("toggleBtn");
        const statusDiv = document.getElementById("status");

        // Tiny silent audio loop to prevent mobile browsers from killing background GPS tracking
        const silentAudio = new Audio("data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");
        silentAudio.loop = true;

        function toggleWalking() {
            if (!watchId) {
                startTracking();
            } else {
                stopTracking();
            }
        }

        function startTracking() {
            const hawkerId = document.getElementById("hawkerName").value.trim();
            const productType = document.getElementById("productType").value;
            const routeLane = document.getElementById("routeLane").value.trim();
            const vendorNote = document.getElementById("vendorNote").value.trim();

            if (!hawkerId) {
                alert("Please enter your name.");
                return;
            }

            if (navigator.geolocation) {
                // Play silent audio to trick mobile OS into treating this tab like an active media player (keeps CPU awake in pocket)
                silentAudio.play().catch(err => console.log("Audio wake lock active"));

                btn.innerText = "Stop Walking / Pocket Mode";
                btn.classList.add("active");
                statusDiv.innerText = "Status: 🟢 Pocket Mode Active (Broadcasting live)";

                // Start continuous GPS watch with high accuracy and zero age cache
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        // Save richer state to local storage for customer radar
                        let activeHawkers = JSON.parse(localStorage.getItem('activeHawkers') || '{}');
                        activeHawkers[hawkerId] = {
                            lat,
                            lon,
                            productType,
                            routeLane,
                            vendorNote,
                            lastUpdated: new Date().toLocaleTimeString()
                        };
                        localStorage.setItem('activeHawkers', JSON.stringify(activeHawkers));
                    },
                    (error) => {
                        statusDiv.innerText = `GPS Error: ${error.message}`;
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            } else {
                alert("Geolocation is not supported by your phone browser.");
            }
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                
                // Pause silent audio loop
                silentAudio.pause();

                const hawkerId = document.getElementById("hawkerName").value.trim();
                let activeHawkers = JSON.parse(localStorage.getItem('activeHawkers') || '{}');
                delete activeHawkers[hawkerId];
                localStorage.setItem('activeHawkers', JSON.stringify(activeHawkers));
            }
            btn.innerText = "Start Walking";
            btn.classList.remove("active");
            statusDiv.innerText = "Status: Offline";
        }
    </script>
</body>
</html>
