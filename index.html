<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighborhood Radar - Customer</title>
    
    <!-- Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
            margin: 0;
        }
        h2 { color: #333; margin: 10px 0; }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        #map {
            height: 380px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .radar-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: left;
            margin-bottom: 15px;
        }
        .hawker-card {
            background: #e9f7ef;
            border-left: 5px solid #28a745;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
        }
        .alert-active {
            background: #f8d7da;
            border-left-color: #dc3545;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 5px;
        }
        .badge {
            background: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            float: right;
        }
        .badge-city {
            background: #17a2b8;
        }
    </style>

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <h2>Neighborhood Radar 📡</h2>
        <p>Live Citywide Fleet & Proximity Alerts</p>

        <!-- Interactive Map Container -->
        <div id="map"></div>

        <div class="radar-box">
            <h3>📍 My House Settings</h3>
            <p id="myLocationText">Loading default location (Accra)...</p>
            <button onclick="setMyCurrentLocation()">Set My House to Current GPS</button>
        </div>

        <div class="radar-box">
            <h3>🚨 Proximity Alerts (Within 500m)</h3>
            <div id="nearFeed">Scanning for nearby hawkers...</div>
        </div>

        <div class="radar-box">
            <h3>🛵 Citywide Active Fleet (Live Map Feed)</h3>
            <div id="cityFeed">Checking city activity...</div>
        </div>
    </div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Default customer location (Accra center)
        let customerLat = 5.6037; 
        let customerLon = -0.1870;
        const ALERT_RADIUS_METERS = 500;

        // Initialize Map
        const map = L.map('map').setView([customerLat, customerLon], 14);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add Customer Marker & Radius Circle
        let customerMarker = L.marker([customerLat, customerLon]).addTo(map)
            .bindPopup("<b>My House (Radar Center)</b>").openPopup();

        let radiusCircle = L.circle([customerLat, customerLon], {
            color: '#007bff',
            fillColor: '#3090C7',
            fillOpacity: 0.12,
            radius: ALERT_RADIUS_METERS
        }).addTo(map);

        let hawkerMarkers = {};
        let alertedHawkers = {};

        function setMyCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    customerLat = position.coords.latitude;
                    customerLon = position.coords.longitude;
                    
                    map.setView([customerLat, customerLon], 15);
                    customerMarker.setLatLng([customerLat, customerLon]);
                    radiusCircle.setLatLng([customerLat, customerLon]);

                    document.getElementById("myLocationText").innerHTML = 
                        `Lat: ${customerLat.toFixed(5)}, Lon: ${customerLon.toFixed(5)}`;
                }, error => {
                    alert("Unable to retrieve location: " + error.message);
                });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        // Haversine formula
        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        async function scanCloudRadar() {
            const { data: activeHawkers, error } = await supabaseClient
                .from('active_hawkers')
                .select(`
                    id,
                    route_lane,
                    vendor_note,
                    lat,
                    lon,
                    products (
                        product_name,
                        comical_call,
                        audio_url
                    )
                `);

            const nearFeedDiv = document.getElementById("nearFeed");
            const cityFeedDiv = document.getElementById("cityFeed");

            if (error) {
                nearFeedDiv.innerHTML = "Error syncing with cloud radar.";
                console.error(error);
                return;
            }

            let nearHtml = "";
            let cityHtml = "";
            let foundNear = false;
            let foundCity = false;
            let activeIds = activeHawkers.map(h => h.id);

            // Clean up markers of vendors who went offline
            for (let id in hawkerMarkers) {
                if (!activeIds.includes(id)) {
                    map.removeLayer(hawkerMarkers[id]);
                    delete hawkerMarkers[id];
                }
            }

            activeHawkers.forEach(data => {
                const distance = getDistanceFromLatLonInMeters(customerLat, customerLon, data.lat, data.lon);
                const roundedDist = Math.round(distance);
                const isNearby = distance <= ALERT_RADIUS_METERS;

                const prodName = data.products ? data.products.product_name : 'General Item';
                const comicalCall = data.products ? data.products.comical_call : 'Coming straight to your gate!';
                const audioUrl = data.products ? data.products.audio_url : null;

                // Ride-hailing map marker style (shows all active vendors across the city)
                if (hawkerMarkers[data.id]) {
                    hawkerMarkers[data.id].setLatLng([data.lat, data.lon]);
                    hawkerMarkers[data.id].bindPopup(`<b>🛒 ${data.id}</b><br>Selling: ${prodName}<br>Distance: ${roundedDist}m`);
                } else {
                    hawkerMarkers[data.id] = L.marker([data.lat, data.lon], {
                        icon: L.divIcon({
                            className: 'custom-icon',
                            html: '🛒',
                            iconSize: [32, 32]
                        })
                    }).addTo(map).bindPopup(`<b>🛒 ${data.id}</b><br>Selling: ${prodName}<br>Distance: ${roundedDist}m`);
                }

                // Citywide Feed Entry (Always displayed to show human activity)
                foundCity = true;
                cityHtml += `
                    <div class="hawker-card" style="border-left-color: ${isNearby ? '#dc3545' : '#17a2b8'};">
                        <span class="badge ${isNearby ? '' : 'badge-city'}">${isNearby ? 'Nearby' : 'Citywide'}</span>
                        <strong>👤 ${data.id}</strong> (${data.route_lane})<br>
                        📦 Selling: ${prodName}<br>
                        📏 Distance: ${roundedDist} meters
                    </div>
                `;

                // Proximity Alert Feed & Audio Trigger
                if (isNearby) {
                    foundNear = true;
                    if (!alertedHawkers[data.id]) {
                        playDynamicAudio(audioUrl);
                        alertedHawkers[data.id] = true;
                    }

                    nearHtml += `
                        <div class="hawker-card alert-active">
                            <span class="badge">ALERT 🚨</span>
                            <strong>👤 ${data.id}</strong><br>
                            📢 <em>${comicalCall}</em><br>
                            📝 Note: "${data.vendor_note}"<br>
                            📏 Distance: <strong>${roundedDist} meters</strong><br>
                            🚨 <strong>At your gate! Step outside!</strong>
                        </div>
                    `;
                } else {
                    alertedHawkers[data.id] = false;
                }
            });

            if (!foundNear) {
                nearFeedDiv.innerHTML = "No hawkers currently within your 500m proximity zone.";
            } else {
                nearFeedDiv.innerHTML = nearHtml;
            }

            if (!foundCity) {
                cityFeedDiv.innerHTML = "No active hawkers online in the city right now.";
            } else {
                cityFeedDiv.innerHTML = cityHtml;
            }
        }

        function playDynamicAudio(url) {
            if (url) {
                const sound = new Audio(url);
                sound.play().catch(err => {
                    console.log("Audio play blocked by browser policy:", err);
                });
            }
        }

        // Poll cloud radar every 3 seconds
        setInterval(scanCloudRadar, 3000);
        scanCloudRadar();
    </script>

</body>
</html>
