<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-to-Door Radar</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 15px;
            margin: 0;
        }
        h2 { color: #333; margin: 5px 0; }
        .subtitle { color: #666; font-size: 13px; margin-bottom: 12px; }
        
        #map-container {
            height: 50vh;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            margin-bottom: 15px;
            overflow: hidden;
            background: #ddd;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .control-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
            font-size: 14px;
        }
        .vendor-card {
            background: #e9f7ef;
            border-left: 4px solid #28a745;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
        }
        .alert-card {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        button {
            padding: 12px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            margin-top: 8px;
            font-weight: bold;
        }
        .status-pill {
            font-weight: bold;
            color: #28a745;
        }
    </style>

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h2>Store-to-Door Radar 📡</h2>
    <div class="subtitle">Live Street Vendor Fleet</div>

    <!-- Map Container -->
    <div id="map-container">
        <iframe id="googleMap" src="https://maps.google.com/maps?q=5.6037,-0.1870&z=15&output=embed"></iframe>
    </div>

    <!-- Status & Feed Box -->
    <div class="control-box">
        <div>📍 <span id="myLocationText">Default Location: Accra Center</span></div>
        <button onclick="setMyCurrentLocation()">Set My House to Current GPS</button>
        <div style="margin-top: 10px; font-size: 13px; color: #555;">
            Radar Status: <span class="status-pill">🟢 Scanning Live (500m Audio Alert)</span>
        </div>
        
        <div id="liveFeed" style="margin-top: 15px;">
            <b>Active Nearby Vendors:</b>
            <div id="vendorList" style="color: #666; font-size: 13px; margin-top: 5px;">Scanning cloud radar...</div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let customerLat = 5.6037; 
        let customerLon = -0.1870;
        const ALERT_RADIUS_METERS = 500;
        let alertedHawkers = {};

        function setMyCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    customerLat = position.coords.latitude;
                    customerLon = position.coords.longitude;
                    
                    // Update iframe map location instantly
                    document.getElementById("googleMap").src = `https://maps.google.com/maps?q=${customerLat},${customerLon}&z=15&output=embed`;

                    document.getElementById("myLocationText").innerHTML = 
                        `House GPS Set (${customerLat.toFixed(4)}, ${customerLon.toFixed(4)})`;
                }, error => {
                    alert("Unable to retrieve location: " + error.message);
                }, { enableHighAccuracy: true });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        function getProductEmoji(code) {
            switch(code) {
                case 'bread': return '🍞';
                case 'chips': return '🍟';
                case 'water': return '🧊';
                default: return '🛒';
            }
        }

        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function scanCloudRadar() {
            const { data: activeHawkers, error } = await supabaseClient
                .from('active_hawkers')
                .select(`
                    id,
                    product_code,
                    route_lane,
                    vendor_note,
                    lat,
                    lon,
                    products (
                        product_name,
                        comical_call,
                        audio_url
                    )
                `);

            const vendorListDiv = document.getElementById("vendorList");

            if (error) {
                vendorListDiv.innerHTML = "Error syncing with cloud radar.";
                return;
            }

            if (!activeHawkers || activeHawkers.length === 0) {
                vendorListDiv.innerHTML = "No active hawkers online right now.";
                return;
            }

            let htmlContent = "";

            activeHawkers.forEach(data => {
                const distance = getDistanceFromLatLonInMeters(customerLat, customerLon, data.lat, data.lon);
                const roundedDist = Math.round(distance);
                const isNearby = distance <= ALERT_RADIUS_METERS;

                const emoji = getProductEmoji(data.product_code);
                const prodName = data.products ? data.products.product_name : 'Item';
                const comicalCall = data.products ? data.products.comical_call : 'Coming your way!';
                const audioUrl = data.products ? data.products.audio_url : null;

                htmlContent += `
                    <div class="vendor-card ${isNearby ? 'alert-card' : ''}">
                        <b>${emoji} ${data.id}</b> (${prodName})<br>
                        Area: ${data.route_lane} | 📏 <b>${roundedDist}m away</b><br>
                        <em>"${data.vendor_note}"</em>
                        ${isNearby ? '<br><span style="color:red; font-weight:bold;">🚨 AT YOUR GATE!</span>' : ''}
                    </div>
                `;

                if (isNearby) {
                    if (!alertedHawkers[data.id]) {
                        if (audioUrl) {
                            new Audio(audioUrl).play().catch(e => console.log("Audio play prevented"));
                        }
                        alertedHawkers[data.id] = true;
                    }
                } else {
                    alertedHawkers[data.id] = false;
                }
            });

            vendorListDiv.innerHTML = htmlContent;
        }

        setInterval(scanCloudRadar, 3000);
        scanCloudRadar();
    </script>

</body>
</html>
