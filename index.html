<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-to-Door Radar</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 15px;
            margin: 0;
        }
        h2 { color: #333; margin: 5px 0; }
        .subtitle { color: #666; font-size: 13px; margin-bottom: 12px; }
        
        #map {
            height: 50vh;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            margin-bottom: 15px;
            background: #e5e3df; 
        }
        
        .control-box {
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
            font-size: 14px;
        }
        button {
            padding: 12px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            margin-top: 8px;
            font-weight: bold;
        }
        .status-pill {
            font-weight: bold;
            color: #28a745;
        }
    </style>

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h2>Store-to-Door Radar 📡</h2>
    <div class="subtitle">Live Street Vendor Fleet</div>

    <!-- Interactive Map Container -->
    <div id="map"></div>

    <!-- Simple Status & Location Box -->
    <div class="control-box">
        <div>📍 <span id="myLocationText">Default Location: Accra Center</span></div>
        <button onclick="setMyCurrentLocation()">Set My House to Current GPS</button>
        <div style="margin-top: 10px; font-size: 13px; color: #555;">
            Radar Status: <span class="status-pill">🟢 Scanning Live (500m Audio Alert)</span>
        </div>
    </div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Default customer location (Accra center)
        let customerLat = 5.6037; 
        let customerLon = -0.1870;
        const ALERT_RADIUS_METERS = 500;

        // Initialize Map
        const map = L.map('map').setView([customerLat, customerLon], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Fix mobile grey box rendering issue by forcing a size refresh
        setTimeout(() => {
            map.invalidateSize();
        }, 300);

        // Customer Marker & Radius
        let customerMarker = L.marker([customerLat, customerLon]).addTo(map)
            .bindPopup("<b>🏠 My House / Default Location</b>").openPopup();

        let radiusCircle = L.circle([customerLat, customerLon], {
            color: '#007bff',
            fillColor: '#3090C7',
            fillOpacity: 0.1,
            radius: ALERT_RADIUS_METERS
        }).addTo(map);

        let hawkerMarkers = {};
        let alertedHawkers = {};

        function setMyCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    customerLat = position.coords.latitude;
                    customerLon = position.coords.longitude;
                    
                    map.setView([customerLat, customerLon], 15);
                    customerMarker.setLatLng([customerLat, customerLon]);
                    radiusCircle.setLatLng([customerLat, customerLon]);

                    document.getElementById("myLocationText").innerHTML = 
                        `House GPS Set (${customerLat.toFixed(4)}, ${customerLon.toFixed(4)})`;
                }, error => {
                    alert("Unable to retrieve location: " + error.message);
                }, { enableHighAccuracy: true });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        function getProductEmoji(code) {
            switch(code) {
                case 'bread': return '🍞';
                case 'chips': return '🍟';
                case 'water': return '🧊';
                default: return '🛒';
            }
        }

        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function scanCloudRadar() {
            const { data: activeHawkers, error } = await supabaseClient
                .from('active_hawkers')
                .select(`
                    id,
                    product_code,
                    route_lane,
                    vendor_note,
                    lat,
                    lon,
                    products (
                        product_name,
                        comical_call,
                        audio_url
                    )
                `);

            if (error) {
                console.error("Cloud sync error:", error);
                return;
            }

            let activeIds = activeHawkers.map(h => h.id);

            for (let id in hawkerMarkers) {
                if (!activeIds.includes(id)) {
                    map.removeLayer(hawkerMarkers[id]);
                    delete hawkerMarkers[id];
                }
            }

            activeHawkers.forEach(data => {
                const distance = getDistanceFromLatLonInMeters(customerLat, customerLon, data.lat, data.lon);
                const roundedDist = Math.round(distance);
                const isNearby = distance <= ALERT_RADIUS_METERS;

                const emoji = getProductEmoji(data.product_code);
                const prodName = data.products ? data.products.product_name : 'Item';
                const comicalCall = data.products ? data.products.comical_call : 'Coming your way!';
                const audioUrl = data.products ? data.products.audio_url : null;

                const popupContent = `
                    <div style="text-align: center;">
                        <b>${emoji} ${data.id}</b><br>
                        Selling: <b>${prodName}</b><br>
                        Area: ${data.route_lane}<br>
                        <em>"${data.vendor_note}"</em><br>
                        📏 <b>${roundedDist}m away</b>
                        ${isNearby ? '<br><span style="color:red; font-weight:bold;">🚨 AT YOUR GATE!</span>' : ''}
                    </div>
                `;

                if (hawkerMarkers[data.id]) {
                    hawkerMarkers[data.id].setLatLng([data.lat, data.lon]);
                    hawkerMarkers[data.id].getPopup().setContent(popupContent);
                } else {
                    hawkerMarkers[data.id] = L.marker([data.lat, data.lon], {
                        icon: L.divIcon({
                            className: 'custom-vendor-icon',
                            html: `<div style="font-size: 24px; background: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.3); border: 2px solid #007bff;">${emoji}</div>`,
                            iconSize: [36, 36],
                            iconAnchor: [18, 18]
                        })
                    }).addTo(map).bindPopup(popupContent);
                }

                if (isNearby) {
                    if (!alertedHawkers[data.id]) {
                        if (audioUrl) {
                            new Audio(audioUrl).play().catch(e => console.log("Audio play prevented"));
                        }
                        alertedHawkers[data.id] = true;
                    }
                } else {
                    alertedHawkers[data.id] = false;
                }
            });
        }

        setInterval(scanCloudRadar, 3000);
        scanCloudRadar();
    </script>

</body>
</html>
